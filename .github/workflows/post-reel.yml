name: Post daily reel

on:
  schedule:
    - cron: "30 13 * * *"   # 13:30 UTC = 7:00 PM IST (GitHub may start a few minutes late)
  workflow_dispatch:
    inputs:
      post_date:
        description: "Date to post (YYYY-MM-DD). Leave empty for today (IST)."
        required: false
      dry_run:
        description: "Only check token + account, don't post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: post-reel

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Skip if this reel was already posted
        id: guard
        run: |
          D="${{ github.event.inputs.post_date }}"; [ -z "$D" ] && D=$(TZ=Asia/Kolkata date +%F)
          echo "date=$D" >> $GITHUB_OUTPUT
          if [ -f "reels/$D/posted.txt" ] && [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            echo "Reel for $D was already posted ($(cat reels/$D/posted.txt)). Nothing to do."; echo "skip=true" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Publish reel
        if: steps.guard.outputs.skip != 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841417918269673"                 # @twin.heros Instagram account id
          IG_BUSINESS_ID: "1167254632519883"              # SmartWork AI business portfolio
          IG_USERNAME: "twin.heros"
          PAGES_BASE_URL: "https://jadhavshubh0709-cloud.github.io/kids-stories-autopost"
          POST_DATE: ${{ github.event.inputs.post_date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: java src/PostReel.java
      - name: Remember that it was posted
        if: steps.guard.outputs.skip != 'true' && github.event.inputs.dry_run != 'true' && hashFiles(format('reels/{0}/reel.mp4', steps.guard.outputs.date)) != ''
        run: |
          D="${{ steps.guard.outputs.date }}"
          date -u +%FT%TZ > "reels/$D/posted.txt"
          git config user.name "twin-heroes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "reels/$D/posted.txt" && git commit -m "Posted reel $D" && git pull --rebase -q origin main && git push
