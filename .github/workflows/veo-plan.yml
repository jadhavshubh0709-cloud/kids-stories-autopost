name: Veo story - write story and clip prompts

# Writes a 3-scene story + 3 Veo prompts (inbox/<date>/PROMPTS.md) and sends them as a GitHub notification.
# Make the 3 clips in the Gemini app, upload them as 1.mp4 2.mp4 3.mp4 to inbox/<date>/ -> "Veo story - build reel" runs.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date (YYYY-MM-DD). Empty = today (IST)."
        required: false

permissions:
  contents: write
  issues: write

concurrency: repo-writes

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow numpy
      - name: Write story and Veo prompts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          D="${{ github.event.inputs.date }}"; [ -z "$D" ] && D=$(TZ=Asia/Kolkata date +%F)
          echo "D=$D" >> $GITHUB_ENV
          python3 pipeline/clip_story.py plan --date "$D"
      - name: Commit
        run: |
          git config user.name "kahani-bot"
          git config user.email "actions@users.noreply.github.com"
          git add specs content inbox
          git diff --cached --quiet || (git commit -m "Veo story plan $D" && git pull --rebase -q origin "$GITHUB_REF_NAME" && git push)
      - name: Notify (GitHub issue with the prompts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Make today's 3 clips: $D" --body-file "inbox/$D/PROMPTS.md" --assignee "${{ github.repository_owner }}" \
            || gh issue create --title "Make today's 3 clips: $D" --body-file "inbox/$D/PROMPTS.md"
